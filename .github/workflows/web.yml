name: web

on:
  pull_request:
    paths: &paths
      - 'web/**'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Check syntax
        run: npm run check
      - name: Test
        run: npm test
      - name: Check wrangler config
        run: npx wrangler deploy --dry-run --outdir dist

  # main に入った web/ の変更を meltype.moe に出す (#1450)。
  # Cloudflare のトークンは環境 web-production の secrets に置く (無ければ出さずに飛ばす。fork でも失敗にしない)
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'yksr-melt/Meltype'
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: web-production
      url: https://meltype.moe
    concurrency:
      group: web-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check token
        id: token
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN が無いので、デプロイを飛ばします"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.ok == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 24
      - name: Install
        if: steps.token.outputs.ok == 'true'
        run: npm ci
      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: npm run deploy
