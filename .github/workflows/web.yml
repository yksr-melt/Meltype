name: web

on:
  pull_request:
    paths: &paths
      - 'web/**'
      - 'docs/*.md'
      - 'docs/images/**'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  # main への push は取り消さない (deploy ジョブがマイグレーションと wrangler deploy の間で止まらないように)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Check syntax
        run: npm run check
      - name: Test
        run: npm test
      - name: Build guide
        run: npm run guide
      - name: Check wrangler config
        run: npx wrangler deploy --dry-run --outdir dist

  # main に入った web/ の変更を meltype.moe に出す (#1450)。
  # Cloudflare のトークンは環境 web-production の secrets に置く (無ければ失敗にする。本番に出ていないことに気づけるように。fork では動かさない)
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'yksr-melt/Meltype'
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: web-production
      url: https://meltype.moe
    concurrency:
      group: web-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check token
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::環境 web-production に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を入れてください (web/README.md の「デプロイ」)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Deploy
        run: npm run deploy
