name: web

on:
  pull_request:
    paths: &paths
      - 'web/**'
      # /playground/・/web-engine/ のエンジン。Core だけを変えたときは、次に web/ をデプロイしたときに出る
      - 'web-engine/**'
      - 'src/Meltype.Web/**'
      - 'docs/*.md'
      - 'docs/images/**'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  # main への push は取り消さない (deploy ジョブがマイグレーションと wrangler deploy の間で止まらないように)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# bash を明示すると -eo pipefail で動き、パイプの途中のコマンドの失敗も止まる (既定の bash -e では最後のコマンドしか見ない。#1842)
defaults:
  run:
    shell: bash

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Check syntax
        run: npm run check
      - name: Test
        run: npm test
      - name: Build guide
        run: npm run guide
      - name: Check wrangler config
        run: npx wrangler deploy --dry-run --outdir dist

  # main に入った web/ の変更を meltype.moe に出す (#1450)。
  # /playground/・/web-engine/ の Web エンジン (Core と Mozc の WebAssembly) はコミットしないので、ここで作る。
  # Mozc のビルドは初回 30 分以上かかるので、Bazel のキャッシュを残す (mac.yml と同じ)
  # Cloudflare のトークンは環境 web-production の secrets に置く (無ければ失敗にする。本番に出ていないことに気づけるように。fork では動かさない)
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'yksr-melt/Meltype'
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: web-production
      url: https://meltype.moe
    concurrency:
      group: web-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: web
    # Cloudflare のトークンは、使う手順 (Check token・Deploy) だけに渡す。
    # ジョブ全体に渡すと、外から取ってきてビルドする Mozc・emsdk・wasm-tools の手順からも読めてしまう
    steps:
      - name: Check token
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::環境 web-production に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を入れてください (web/README.md の「デプロイ」)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: wasm-tools
        run: dotnet workload install wasm-tools
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/bazel-cache
            ~/mozc-wasm/src/third_party_cache
          key: mozc-wasm-${{ hashFiles('native/mozc/MOZC_COMMIT') }}-${{ hashFiles('native/mozc/*.cc', 'native/mozc/BUILD.wasm.fragment', 'native/mozc/thread-inline.patch') }}
          restore-keys: |
            mozc-wasm-${{ hashFiles('native/mozc/MOZC_COMMIT') }}-
      # Bazelisk は版を固定し、ダウンロードしたものが公開されているものと同じか (SHA-256) を確かめる (linux.yml と同じ)
      - name: Bazelisk
        working-directory: .
        run: |
          mkdir -p "$HOME/tools"
          if ! curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 -o "$HOME/tools/bazelisk" https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64; then
            curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 -H 'Accept: application/octet-stream' -o "$HOME/tools/bazelisk" https://api.github.com/repos/bazelbuild/bazelisk/releases/assets/406879103
          fi
          echo "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  $HOME/tools/bazelisk" | sha256sum -c -
          chmod +x "$HOME/tools/bazelisk"
      - name: Build Mozc (WebAssembly)
        working-directory: .
        run: BAZEL="$HOME/tools/bazelisk" native/mozc/build-mozc-wasm.sh "$HOME/mozc-wasm" "$HOME/bazel-cache"
      - name: Install
        run: npm ci
      # Mozc が無いと、かなのまま確定する版になるので、できたことを確かめる。
      # Cloudflare Workers の静的なファイルは 1 つ 25 MiB まで (超えるとデプロイ全体が失敗する)。
      # mozc.wasm (辞書を含む) がいちばん大きいので、デプロイの前に分かるように調べる
      - name: Build Web engine
        run: |
          npm run web-engine
          test -f public/web-engine/engine/mozc/mozc.wasm
          too_large="$(find public -type f -size +25M)"
          if [ -n "$too_large" ]; then
            echo "::error::Cloudflare Workers に置けない 25 MiB を超えるファイルがあります: $too_large"
            exit 1
          fi
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
