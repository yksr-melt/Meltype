# Debug preview for the Android-only Space swipe change. NOT a release build.
name: Android debug build verification
on:
  push:
    branches: [feat/android-bilingual-adaptive-ime]
    paths:
      - '.github/workflows/android-preview.yml'
      - 'android/**'
      - 'src/Meltype.Core/**'
      - 'src/Meltype.Core.Tests/**'
      - 'src/Meltype.Mac.Native/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run desktop shared Core regression tests
        run: dotnet run --project src/Meltype.Core.Tests/Meltype.Core.Tests.csproj -c Release
      - name: Install Android NDK and source-build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf curl git python3 build-essential
          sdkmanager 'ndk;28.2.13676358'
      - uses: gradle/actions/wrapper-validation@v4
      - name: Rebuild pinned Mozc JNI and dictionary from source
        run: bash android/tools/build-mozc.sh
      - name: Rebuild shared C# Meltype.Core for Android
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
        run: |
          bash android/tools/build-meltype-native.sh
      - name: Compile current Android source and run JVM tests
        working-directory: android
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify Android 16 KiB ELF and APK alignment
        run: python3 android/tools/check-apk-16k.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Save disposable debug APK and build unsigned release variant
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/build/preview
          cp android/app/build/outputs/apk/debug/app-debug.apk android/build/preview/Meltype-debug-ephemeral.apk
          cd android
          ./gradlew --no-daemon :app:assembleRelease
          git -C .. rev-parse HEAD > build/preview/source-commit.txt
          printf '%s\n' 'NOT FOR DISTRIBUTION: debug APK uses an ephemeral CI key; release APK is unsigned.' > build/preview/README.txt
          sha256sum build/preview/Meltype-debug-ephemeral.apk > build/preview/apk-sha256.txt
      - name: Upload freshly compiled debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meltype-android-debug-build-check
          path: |
            android/build/preview/
            android/app/build/test-results/testDebugUnitTest/
          retention-days: 30
          if-no-files-found: warn
