# マージしたあとのコンフリクトの予告 (.github/bot/conflicts.mjs)。
#   「この Pull Request をマージすると、どの Pull Request がコンフリクトするか」をコメントする
#   (いま main とコンフリクトしているかのラベルとコメントは Mergify が付ける。.mergify.yml)
# main に push されたときと 1 時間ごとに、開いている Pull Request を全部調べる (Pull Request のイベントでは動かさない)。
# Pull Request のコードは git の中に取ってくるだけで、実行しない
# (スクリプトは main のものを使い、コンフリクトは git merge-tree で確かめる)。
name: conflicts

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: conflicts
  cancel-in-progress: false

# bash を明示すると -eo pipefail で動き、パイプの途中のコマンドの失敗も止まる (既定の bash -e では最後のコマンドしか見ない。#1842)
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # bot のスクリプトは main から取る (Pull Request のスクリプトは使わない)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: app
        if: vars.BOT_APP_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - name: git の設定 (手元で merge の commit を作るため。push はしない)
        run: |
          git config user.name meltype-bot
          git config user.email meltype-bot@users.noreply.github.com
      - name: 開いている Pull Request を全部調べる
        run: node .github/bot/conflicts.mjs
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
