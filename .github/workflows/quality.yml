# コードの品質のチェック (issue #1083)。ビルドとテストは windows.yml・core.yml、辞書・精度は core.yml、報告の再現は pr-expectations.yml。
#   フォーマット … すべての .cs を dotnet format whitespace で調べ、違反があれば失敗
#   静的解析     … Roslyn の解析 (AnalysisLevel=latest-recommended) の警告が 1 件でもあれば失敗。重要度は .editorconfig で変える。
#                  SDK (10.0.x) が上がって新しいルールが増えると、main でも失敗する。
#                  Windows 版のプロジェクトも EnableWindowsTargeting で Linux のランナーで調べる
name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

# bash を明示すると -eo pipefail で動き、パイプの途中のコマンドの失敗も止まる (既定の bash -e では最後のコマンドしか見ない。#1842)
defaults:
  run:
    shell: bash

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: フォーマット
        run: dotnet format whitespace --folder --verify-no-changes
      - name: 静的解析
        run: dotnet build Meltype.sln -c Release -p:AnalysisLevel=latest-recommended -p:TreatWarningsAsErrors=true -p:EnableWindowsTargeting=true
