# コードの品質のチェック (issue #1083)。ビルドとテストは windows.yml・core.yml、辞書・精度は core.yml、報告の再現は pr-expectations.yml。
#   フォーマット   … すべての .cs を dotnet format whitespace で調べ、違反があれば失敗
#   静的解析       … Roslyn の解析 (AnalysisLevel=latest-recommended) の警告が 1 件でもあれば失敗。重要度は .editorconfig で変える。
#                    SDK (10.0.x) が上がって新しいルールが増えると、main でも失敗する。
#                    結果は SARIF にして Code scanning に送る。大きな移行の note は IDE に残す。命名は理由付きのソース内抑制を反映する (tools/filter-sarif.mjs)。
#   スクリプト     … .github/bot と tools の Node のスクリプトのテスト
#   依存関係       … Pull Request で足した・上げた依存 (npm・Swift・Actions など) に、既知の脆弱性 (high 以上) があれば失敗
# セキュリティの解析 (CodeQL) は codeql.yml。
name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Check format
        run: dotnet format whitespace --folder --verify-no-changes

  analyzers:
    # Windows 版のプロジェクトは Windows でしかビルドできないので、プロジェクトごとに分ける (SARIF の category もプロジェクトごと)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: Meltype, os: windows-latest }
          - { project: Meltype.Tests, os: windows-latest }
          - { project: Meltype.Core, os: ubuntu-latest }
          - { project: Meltype.Core.Tests, os: ubuntu-latest }
          - { project: Meltype.Mac.Native, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build with analyzers
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sarif"
          dotnet build "src/${{ matrix.project }}/${{ matrix.project }}.csproj" -c Release \
            -p:AnalysisLevel=latest-recommended -p:TreatWarningsAsErrors=true "-p:MeltypeSarifDir=$RUNNER_TEMP/sarif"
      # 警告でビルドが失敗しても、SARIF ができていれば Code scanning に送る
      - name: Keep migration suggestions in the IDE
        id: sarif
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SARIF_FILE: ${{ runner.temp }}/sarif/${{ matrix.project }}.sarif
        run: |
          if [ -f "$SARIF_FILE" ]; then
            node tools/filter-sarif.mjs "$SARIF_FILE"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ !cancelled() && steps.sarif.outputs.exists == 'true' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/sarif/${{ matrix.project }}.sarif
          category: roslyn-${{ matrix.project }}

  # .github/bot と tools の Node のスクリプトのテスト。--self-test はファイルの中に判定の例を持つ bot (GitHub には何も書かない)
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test .github/bot/*.test.mjs tools/*.test.mjs
      - name: Self-test
        run: |
          node .github/bot/notices.mjs --self-test
          node .github/bot/code-scanning.mjs --self-test
          node .github/bot/sponsors.mjs --self-test

  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
