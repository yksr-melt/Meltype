# 貢献者ライセンス同意 (CLA) の bot。初めて Pull Request を出した人に、コメントで同意してもらう (bots/cla/main.ts)。
# pull_request_target は書き込みの権限を持つので、Pull Request のコードはチェックアウトしない (main の bot のスクリプトだけを使う)。
name: cla

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  cla:
    # コメントは Pull Request のものだけ
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # 同意の記録 (cla-signatures ブランチ)
      pull-requests: write
      issues: write
      statuses: write        # 「CLA」のチェック
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: bots
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: bots/package.json
      - run: bun install --frozen-lockfile --production --ignore-scripts
        working-directory: bots
      - run: bun bots/cla/main.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
