# Pull Request のチェック「報告の再現」。
#   本文の「## 確かめること」の「入力 → 期待」を、Pull Request のコードと Mozc のヘルパーで確かめる。
#   ヘルパーは Pull Request のコードでビルドする (linux.yml と同じ手順とキャッシュ)
# 本文を読むので、本文の編集 (edited) でも流す。必須チェックにはしない
# (edited の run は取り消し合い、最新の run がこのチェックを報告しないまま残ることがある)。
# pull_request なので、フォークからの Pull Request でも書き込みの権限は持たない (結果は Summary とチェックの成否で返す)。
name: pr-expectations

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: pr-expectations-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# bash を明示すると -eo pipefail で動き、パイプの途中のコマンドの失敗も止まる (既定の bash -e では最後のコマンドしか見ない。#1842)
defaults:
  run:
    shell: bash

jobs:
  expectations:
    name: 報告の再現
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cases
        run: node .github/bot/pr-checks.mjs cases "$RUNNER_TEMP/cases.txt"
      - if: steps.cases.outputs.count != '0'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      # Core とヘルパーのやり取りは同じコードのものでしか通じない (リリースのヘルパーは、その後に足したコマンドを受け付けない)。
      # main に push したときの linux.yml が同じキーでキャッシュするので、native/mozc を変えていなければ Bazel はキャッシュから作る
      - if: steps.cases.outputs.count != '0'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/bazel-cache
            ~/mozc/src/third_party_cache
          key: mozc-manylinux_2_34-linux-${{ hashFiles('native/mozc/MOZC_COMMIT') }}-${{ hashFiles('native/mozc/*.cc', 'native/mozc/BUILD.fragment') }}
          restore-keys: |
            mozc-manylinux_2_34-linux-${{ hashFiles('native/mozc/MOZC_COMMIT') }}-
      # linux.yml の Bazelisk・Build Mozc helper と同じ
      - name: Build Mozc helper
        if: steps.cases.outputs.count != '0'
        run: |
          mkdir -p "$HOME/tools" "$HOME/mozc" "$HOME/bazel-cache"
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 -o "$HOME/tools/bazelisk" https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          echo "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  $HOME/tools/bazelisk" | sha256sum -c -
          chmod +x "$HOME/tools/bazelisk"
          docker run --rm --user "$(id -u):$(id -g)" -e USER -e HOME=/tmp/home -e BAZEL=/tools/bazelisk \
            -v "$PWD:/repo" -v "$HOME/mozc:/mozc" -v "$HOME/bazel-cache:/cache" -v "$HOME/tools:/tools:ro" -w /repo \
            quay.io/pypa/manylinux_2_34_x86_64:2026.11.01-2 \
            native/mozc/build-mozc-helper.sh /mozc /cache
          echo "MELTYPE_MOZC=$PWD/native/mozc/bin/linux/meltype_mozc_helper" >> "$GITHUB_ENV"
      - if: steps.cases.outputs.count != '0'
        run: |
          dotnet run --project src/Meltype.Core.Tests -c Release -- --expect "$RUNNER_TEMP/cases.txt" "$RUNNER_TEMP/cases.json"
          node .github/bot/pr-checks.mjs expect "$RUNNER_TEMP/cases.json"
