# Pull Request のチェック「報告の再現」。
#   本文の「## 確かめること」の「入力 → 期待」と、「Fixes #12」で閉じる誤判定の報告を、Pull Request のコードで確かめる
# 本文を読むので、本文の編集 (edited) でも流す。必須チェックにはしない
# (edited の run は取り消し合い、最新の run がこのチェックを報告しないまま残ることがある)。
# pull_request なので、フォークからの Pull Request でも書き込みの権限は持たない (結果は Summary とチェックの成否で返す)。
name: pr-expectations

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: pr-expectations-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  expectations:
    name: 報告の再現
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cases
        run: node .github/bot/pr-checks.mjs cases "$RUNNER_TEMP/cases.txt"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: steps.cases.outputs.count != '0'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - if: steps.cases.outputs.count != '0'
        run: |
          dotnet run --project src/Meltype.Core.Tests -c Release -- --expect "$RUNNER_TEMP/cases.txt" "$RUNNER_TEMP/cases.json"
          node .github/bot/pr-checks.mjs expect "$RUNNER_TEMP/cases.json"
