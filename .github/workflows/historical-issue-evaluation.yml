# SPDX-License-Identifier: GPL-3.0-or-later
name: Historical issue candidate evaluation

# Live evaluation uses current public Issues, so it is manual-only. PR CI runs the offline fixtures in bot.yml.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Evaluate a bounded set of live historical Issues
        run: node .github/bot/evaluate-live-historical-issues.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          EVALUATION_REPOSITORY: yksr-melt/Meltype
