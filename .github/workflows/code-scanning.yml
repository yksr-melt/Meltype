# CodeQL の指摘を日本語でまとめる bot (bots/code-scanning/main.ts)。
#   CodeQL (codeql.yml) が Pull Request で終わったら、その Pull Request で新しく出た指摘を日本語の表にしてコメントする。
# workflow_run は main のワークフローで動き、書き込みの権限を持つので、Pull Request のコードはチェックアウトしない
# (main の bot のスクリプトだけを使い、Code scanning の結果は GitHub の API で読む)。
name: code-scanning

on:
  workflow_run:
    workflows: [codeql]
    types: [completed]

permissions: {}

concurrency:
  group: code-scanning-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  summary:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: bots
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: bots/package.json
      - run: bun install --frozen-lockfile --production --ignore-scripts
        working-directory: bots
      - run: bun bots/code-scanning/main.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
