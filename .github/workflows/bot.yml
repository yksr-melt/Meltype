# Meltype の GitHub bot。
#   Issue を作ったとき:「要トリアージ」を付ける。Issue を作った・直したとき: 誤判定の報告なら最新のコードで打ってみて結果を返す。
#   コメントの行の先頭のコマンド (1 つのコメントに 1 つ。/repro だけは複数行):
#     だれでも: /repro /explain /ca /jht /help (/learn は /repro・/ca と同じコメントに書き、先に学習させる手順)
#     メンテナー (PR のみ): /repro <SHA> /test /pack /test-jht /test-explain (どれも 1 語目に確かめた commit の SHA (40 桁)。PR の head と違えば動かさない)
#       /repro <SHA> は PR・PR の前 (main との merge base)・main の 3 つの commit で打って比べる
#     管理者: /release <版> /pre-release <版> (コメントの 1 行目だけ。タグとリリースの下書きを作り、配布物のビルドを始める)
# Issue・コメントの文は誰でも書けるので、run: の中に ${{ }} で埋め込まず、環境変数で値として渡す。
# Pull Request のコードは、書き込みの権限を持たない job (run・pr) でだけ動かす。結果のコメントは別の job (report) が書く。
# 漢字変換には、main からビルドした meltype_mozc_helper (job mozc) を使う。Pull Request のコードを動かす job では、Bazel のキャッシュを書き換えられないよう、ビルドしない。
name: bot

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: bot-${{ github.event_name }}-${{ github.event.issue.number }}-${{ github.event.comment.id || github.event.action }}
  cancel-in-progress: true

# pwsh の外部コマンド (dotnet・git など) が失敗したら、その場で止める (#1842)。
# 既定の pwsh は最後のコマンドの終了コードしか見ないので、途中の dotnet run が失敗しても成功になっていた。
# {0} を . で読むので、step の中で $LASTEXITCODE を見なくてよい。
defaults:
  run:
    shell: pwsh -NoProfile -Command "$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      release_command: ${{ steps.parse.outputs.release_command }}
      release_version: ${{ steps.parse.outputs.release_version }}
      action: ${{ steps.parse.outputs.action }}
      issue: ${{ steps.parse.outputs.issue }}
      keys: ${{ steps.parse.outputs.keys }}
      repros: ${{ steps.parse.outputs.repros }}
      versions: ${{ steps.parse.outputs.versions }}
      reported: ${{ steps.parse.outputs.reported }}
      expected: ${{ steps.parse.outputs.expected }}
      sha: ${{ steps.parse.outputs.sha }}
      comment: ${{ steps.parse.outputs.comment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/bot
          persist-credentials: false
      - id: app
        if: vars.BOT_APP_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - id: parse
        run: node .github/bot/meltype-bot.mjs parse
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}

  # /release・/pre-release (管理者だけ): タグとリリースの下書きを作り、配布物のビルドを始める。
  # 書き込みの権限はこの job だけに付ける (parse はだれのコメントでも動くため)。管理者かどうかは、書き込みの前に確かめる
  release:
    needs: parse
    if: needs.parse.outputs.release_command != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/bot
          persist-credentials: false
      - id: app
        if: vars.BOT_APP_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - run: node .github/bot/meltype-bot.mjs release
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          BOT_DISPATCH_TOKEN: ${{ github.token }}
          BOT_RELEASE_COMMAND: ${{ needs.parse.outputs.release_command }}
          BOT_RELEASE_VERSION: ${{ needs.parse.outputs.release_version }}

  mozc:
    needs: parse
    if: contains(fromJSON('["repro","ca","jht","test-jht"]'), needs.parse.outputs.action)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-mozc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bot-mozc
          path: native/mozc/bin/linux/meltype_mozc_helper
          if-no-files-found: error
          retention-days: 1

  # main 上での repro / explain / ca / jht。/repro <SHA> は PR のコードも動かす (メンテナーのみ。parse で author_association と SHA を確認済み)
  run:
    needs: [parse, mozc]
    # explain では job mozc が skipped になる
    if: ${{ !cancelled() && contains(fromJSON('["success","skipped"]'), needs.mozc.result) && contains(fromJSON('["repro","explain","ca","jht"]'), needs.parse.outputs.action) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - if: needs.mozc.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bot-mozc
          path: native/mozc/bin/linux
      - name: Mozc helper
        if: needs.mozc.result == 'success'
        run: &mozc-helper |
          $helper = (Resolve-Path 'native/mozc/bin/linux/meltype_mozc_helper').Path
          chmod +x $helper
          "MELTYPE_MOZC=$helper" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # /repro は Zenzai (最新のリリースの zip の zenzai/ の llama-server とモデル) も使った結果を返す
      - name: Zenzai from latest release
        if: needs.parse.outputs.action == 'repro'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # フォークにはリリースが無いことがあるので、upstream から取る。'Meltype-*-linux.zip' は端末版の zip にも当たるので、タグから名前を作る
          $tag = gh release view --repo yksr-melt/Meltype --json tagName --jq .tagName
          $zip = "Meltype-$($tag.TrimStart('v'))-linux.zip"
          gh release download $tag --repo yksr-melt/Meltype --pattern $zip --dir $env:RUNNER_TEMP
          unzip -q "$env:RUNNER_TEMP/$zip" 'Meltype-linux/zenzai/*' -d $env:RUNNER_TEMP
          $zenzai = "$env:RUNNER_TEMP/Meltype-linux/zenzai"
          "MELTYPE_ZENZAI_SERVER=$zenzai/llama-server" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MELTYPE_ZENZAI_MODEL=$((Get-Item "$zenzai/*.gguf").FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run
        env:
          ACTION: ${{ needs.parse.outputs.action }}
          KEYS: ${{ needs.parse.outputs.keys }}
          REPROS: ${{ needs.parse.outputs.repros }}
          VERSIONS: ${{ needs.parse.outputs.versions }}
          MELTYPE_UTF8: '1'
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          New-Item -ItemType Directory -Force results | Out-Null
          if ($env:ACTION -eq 'explain') {
            dotnet run --project src/Meltype.Core.Tests -c Release -- --explain "$env:KEYS" | Out-File results/explain.txt
            exit 0
          }
          if ($env:ACTION -eq 'jht') {
            # KEYS は「出てほしい文」または「文 / 読み」(空白付きでも 1 引数)
            dotnet run --project src/Meltype.Core.Tests -c Release -- --jht "$env:KEYS" | Out-File results/jht.json -Encoding utf8NoBOM
            exit 0
          }
          # repro と ca (Mozc があれば漢字も。ca も repro と同じく打つ。last は space)。REPROS の i 番目の結果は results/<i>/repro-<版の名前>.json
          # 打つ版は VERSIONS (/repro <SHA> の PR の前・PR・main)。無ければ main と最新のリリース。同じ commit の版は 1 度だけ打つ。
          # PR は最後に打つ (PR のビルドが失敗してもほかの版の結果を返す。PR のコードが動く前に、ほかの版を打ち終える)。
          # 表の並びは report (meltype-bot.mjs) が VERSIONS の順に決める
          $versions = if ($env:VERSIONS) { @($env:VERSIONS | ConvertFrom-Json) } else {
            [pscustomobject]@{ name = 'main'; sha = (git rev-parse HEAD) }
            $tag = git tag -l 'v*' --sort=-v:refname | Select-Object -First 1
            if ($tag -and (git ls-tree --name-only $tag src/Meltype.Core.Tests/Repro.cs)) { [pscustomobject]@{ name = $tag; sha = (git rev-parse "$tag^{commit}") } }
          }
          $head = git rev-parse HEAD
          $done = @{}
          foreach ($v in @($versions | Sort-Object -Stable { $_.name -eq 'pr' })) {
            if ($done.ContainsKey($v.sha)) { continue }
            $done[$v.sha] = $true
            $root = '.'
            if ($v.sha -ne $head) {
              $root = "../$($v.name)"
              git fetch --quiet --no-tags origin $v.sha
              git worktree add --quiet --detach $root $v.sha
            }
            $i = 0
            foreach ($r in ($env:REPROS | ConvertFrom-Json)) {
              $build = if ($i -gt 0) { '--no-build' }
              New-Item -ItemType Directory -Force "results/$i" | Out-Null
              # /learn の手順 (学習に対応する前の版は --learn を読まない。結果に learned が無いことで report が見分ける)
              $learn = @($r.learn | Where-Object { $_ } | ForEach-Object { '--learn'; $_ })
              dotnet run --project "$root/src/Meltype.Core.Tests" -c Release $build -- --repro "$($r.keys)" "$($r.last)" @learn | Out-File "results/$i/repro-$($v.name).json" -Encoding utf8
              $i++
            }
          }
      # 途中で失敗しても、できた分の結果を返す
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bot-results
          path: results/
          retention-days: 7

  # PR のコードで test / pack / test-jht / test-explain (メンテナーのみ。parse で author_association と SHA を確認済み)
  pr:
    needs: [parse, mozc]
    # job mozc は、test-jht のほかでは skipped になる
    if: ${{ !cancelled() && contains(fromJSON('["success","skipped"]'), needs.mozc.result) && contains(fromJSON('["test","pack","test-jht","test-explain"]'), needs.parse.outputs.action) }}
    runs-on: ${{ contains(fromJSON('["test","pack"]'), needs.parse.outputs.action) && 'windows-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.parse.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - if: needs.mozc.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bot-mozc
          path: native/mozc/bin/linux
      - name: Mozc helper
        if: needs.mozc.result == 'success'
        run: *mozc-helper
      - name: Test
        if: needs.parse.outputs.action == 'test'
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          New-Item -ItemType Directory -Force results | Out-Null
          dotnet build Meltype.sln -c Release *> results/build.txt
          # src/Meltype.Windows.Tests に名前を変える前の PR は、Windows のテストが src/Meltype.Tests にある
          $windowsTests = if (Test-Path src/Meltype.Windows.Tests) { 'src/Meltype.Windows.Tests' } else { 'src/Meltype.Tests' }
          dotnet run --project $windowsTests -c Release --no-build *> results/test.txt
      - name: Package
        if: needs.parse.outputs.action == 'pack'
        shell: powershell
        run: .\Build-Package.ps1
      - name: test-jht / test-explain
        if: contains(fromJSON('["test-jht","test-explain"]'), needs.parse.outputs.action)
        env:
          ACTION: ${{ needs.parse.outputs.action }}
          KEYS: ${{ needs.parse.outputs.keys }}
          MELTYPE_UTF8: '1'
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          New-Item -ItemType Directory -Force results | Out-Null
          if ($env:ACTION -eq 'test-explain') {
            dotnet run --project src/Meltype.Core.Tests -c Release -- --explain "$env:KEYS" | Out-File results/explain.txt -Encoding utf8
          } else {
            dotnet run --project src/Meltype.Core.Tests -c Release -- --jht "$env:KEYS" | Out-File results/jht.json -Encoding utf8NoBOM
          }
      # テストの失敗も結果として返すので、step が失敗しても上げる
      - if: ${{ !cancelled() && needs.parse.outputs.action != 'pack' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bot-results
          path: results/
          retention-days: 7
      - if: needs.parse.outputs.action == 'pack'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meltype-pr-${{ needs.parse.outputs.issue }}
          path: dist/Meltype-test-*-setup.exe
          retention-days: 14

  report:
    needs: [parse, run, pr]
    if: always() && needs.parse.result == 'success' && needs.parse.outputs.action != 'none' && needs.parse.outputs.action != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/bot
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: bot-results
          path: results/
      - id: app
        if: vars.BOT_APP_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - run: node .github/bot/meltype-bot.mjs report
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          BOT_ACTION: ${{ needs.parse.outputs.action }}
          BOT_ISSUE: ${{ needs.parse.outputs.issue }}
          BOT_KEYS: ${{ needs.parse.outputs.keys }}
          BOT_REPROS: ${{ needs.parse.outputs.repros }}
          BOT_VERSIONS: ${{ needs.parse.outputs.versions }}
          BOT_REPORTED: ${{ needs.parse.outputs.reported }}
          BOT_EXPECTED: ${{ needs.parse.outputs.expected }}
          BOT_SHA: ${{ needs.parse.outputs.sha }}
          BOT_COMMENT_ID: ${{ needs.parse.outputs.comment }}
          BOT_JOB_RESULT: ${{ needs.run.result == 'success' && 'success' || needs.pr.result == 'success' && 'success' || 'failure' }}
          BOT_RESULTS: results
