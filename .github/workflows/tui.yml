# 端末版 (tui/) をビルドしてテストし、本体・Mozc・Zenzai を同梱した zip を Artifacts に置く。
# 端末版・共通部分を変えた main、手動実行、release.yml (タグ) から呼ばれたとき。
# 端末版のコードを変えた Pull Request では、ビルドとテストだけを流す (zip は作らない)。
# リリースへの添付は release.yml。
name: tui

on:
  # Core・辞書だけの変更は core.yml のテストと lint.yml の NativeAOT のアナライザーで見るので、ここでは流さない
  pull_request:
    paths:
      - 'tui/**'
      - 'native/mozc/**'
      - 'native/zenzai/**'
      - 'native/build-core-linux.sh'
      - '.github/actions/linux-native/**'
      - '.github/actions/linux-mozc/**'
      - 'src/Meltype.Core.CApi/**'
      - '.github/workflows/tui.yml'
  push:
    branches: [main]
    paths:
      - 'tui/**'
      - 'native/mozc/**'
      - 'native/zenzai/**'
      - 'native/build-core-linux.sh'
      - '.github/actions/linux-native/**'
      - '.github/actions/linux-mozc/**'
      - 'src/Meltype.Core/**'
      - 'src/Meltype.Core.CApi/**'
      - 'dictionaries/**'
      - 'nuget.config'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'src/Directory.Build.props'
      - 'src/Directory.Build.targets'
      - 'src/Directory.Packages.props'
      - '.github/workflows/tui.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tui-${{ github.ref }}
  cancel-in-progress: true

# bash を明示すると -eo pipefail で動き、パイプの途中のコマンドの失敗も止まる (既定の bash -e では最後のコマンドしか見ない。#1842)
defaults:
  run:
    shell: bash

jobs:
  app:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: tty-linux
          - runner: ubuntu-24.04-arm
            asset: tty-linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 時間のかかるビルドの前に見つける
      - name: Python tests
        run: python3 tui/test_tty.py
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      # NativeAOT のリンクに使うもの
      - name: Packages
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y clang lld zlib1g-dev
      - uses: ./.github/actions/linux-native
      - name: Build
        run: tui/build.sh
      # 同梱した本体を読み込めるか
      - name: Smoke test
        run: tui/build/Meltype-tty/meltype-tty --version
      - name: Package
        if: github.event_name != 'pull_request'
        run: |
          # タグ (v1.0.0) なら Meltype-1.0.0-tty-linux.zip (arm64 は Meltype-1.0.0-tty-linux-arm64.zip)、それ以外はテスト版の名前
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="Meltype-${GITHUB_REF_NAME#v}-${{ matrix.asset }}.zip"; else name="Meltype-${{ matrix.asset }}-test-$(date +%Y%m%d-%H%M).zip"; fi
          (cd tui/build && zip -qr "$name" Meltype-tty)
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meltype-${{ matrix.asset }}
          path: tui/build/Meltype-*.zip
          retention-days: 14
