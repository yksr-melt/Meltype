name: 変換・判定の間違い
description: 日本語になるはずが英字になった・英語になるはずがかなになった・変換の候補がおかしい
title: "[誤判定] "
labels: ["誤判定"]
body:
  - type: markdown
    attributes:
      value: |
        「打ったもの」と「期待した結果」をもらえれば、そのままテストに入れて直せます。1 つの報告に 1 つの例でも、まとめて何個でも大丈夫です。
        ⚠ パスワードや個人的な文章は書かないでください (似た例に書き換えてもらって大丈夫です)。

  - type: dropdown
    id: kind
    attributes:
      label: 種類
      options:
        - 日本語のつもりが英字になった (にほんgo)
        - 英語のつもりがかなになった (みいてぃんg)
        - 漢字の変換が違う (曲 → 癖)
        - 英字の大文字・小文字・綴りが違う
        - 打ち間違いの直し方が違う
        - そのほか
    validations:
      required: true

  - type: input
    id: typed
    attributes:
      label: 打ったもの (キーをそのまま)
      placeholder: nihongowohanasu
    validations:
      required: true

  - type: input
    id: actual
    attributes:
      label: 出たもの
      placeholder: にほんgoを話す
    validations:
      required: true

  - type: input
    id: expected
    attributes:
      label: 期待した結果
      placeholder: 日本語を話す
    validations:
      required: true

  - type: dropdown
    id: key
    attributes:
      label: 最後に押したキー
      options:
        - Space (変換)
        - Enter (確定)
        - 打っている途中 (まだ確定していない)
        - 句読点・記号
        - そのほか

  - type: dropdown
    id: zenzai
    attributes:
      label: Zenzai (zenz) を使っているか
      description: 設定の「Zenzai を使う」です。ON だと変換の結果が変わるので、直すときに同じ条件で確かめるために使います
      options:
        - 使っていない
        - 使っている
        - 分からない
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 前後の文 (分かれば)
      description: 前の文によって判定が変わることがあります (英文の途中か、日本語の文の途中か)
      placeholder: 前の行は「明日の会議の資料」

  - type: input
    id: app
    attributes:
      label: どのアプリで
      description: コードエディター・チャット・検索欄などで判定の仕方が変わります
      placeholder: VS Code のエディター / Slack

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - Mac (プレビュー版)
        - Linux (プレビュー版)

  - type: input
    id: version
    attributes:
      label: Meltype の版
      placeholder: 0.2.0

  - type: textarea
    id: environment
    attributes:
      label: 実行環境
      description: Meltype の「不具合の報告・提案...」→「GitHub で報告」から開くと自動で入ります (入力した文字は入りません)。
      render: text
