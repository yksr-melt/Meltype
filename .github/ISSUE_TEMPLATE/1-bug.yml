name: 不具合の報告
description: 動かない・止まる・落ちる・表示がおかしいなど
title: "[不具合] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。日本語・英語の判定や変換の間違い (「日本語」が「にほんgo」になった など) は、「変換・判定の間違い」から報告してください。
        ⚠ パスワードや個人的な文章を貼らないでください。ログには直前に打った文字の一部が入ることがあります。見られて困る部分は消してから貼ってください。

  - type: textarea
    id: actual
    attributes:
      label: 何が起きたか
      description: どのアプリで・何をしたら・どうなったか・どうなってほしかったかを書いてください。スクリーンショットがあれば貼ってください
      placeholder: Discord のメッセージ欄で kyouha と打って Space を押すと、打った文字が消えました。「今日は」に変換されてほしいです。
    validations:
      required: true

  - type: dropdown
    id: frontend
    attributes:
      label: OS・フロントエンド
      options:
        - Windows (Meltype IME)
        - Windows (Meltype キーボード)
        - macOS
        - Linux (fcitx5)
        - Linux (IBus)
        - 分からない・まだ入れていない
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Meltype の版
      description: 「ばーじょん」と打って変換すると、候補に出ます。インストールできていないときは「未インストール」と書いてください
      placeholder: 1.4.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 実行環境
      description: Meltype の「不具合の報告・提案...」→「GitHub で報告」から開くと自動で入ります (入力した文字は入りません)。
      render: text

  - type: textarea
    id: log
    attributes:
      label: ログ (あれば)
      description: |
        Windows: トレイのアイコンを右クリック →「ログ / 判定理由...」→「コピー」
        Windows の更新の不具合: %LOCALAPPDATA%\Meltype\update\install.log の中身
        Mac: ターミナルで log stream --predicate 'process == "Meltype"' --level debug を実行してから操作
        見られて困る部分は消してください。
      render: text
