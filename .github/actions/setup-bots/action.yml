name: bots の準備
description: bun と bots/ の実行時の依存を入れる (bun の版は bots/package.json の packageManager)
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: bots/package.json
    - run: bun install --frozen-lockfile --production --ignore-scripts
      shell: bash
      working-directory: bots
