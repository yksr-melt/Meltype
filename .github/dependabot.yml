# .github/dependabot.yml
version: 2

updates:
  # C# / .NET のNuGetパッケージ
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"

  # bots の依存
  - package-ecosystem: "bun"
    directory: "/bots"
    schedule:
      interval: "weekly"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
