# .github/dependabot.yml
version: 2

updates:
  # C# / .NET のNuGetパッケージ
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # 版を揃えて上げる。別々の PR だと隣り合う行を変えてコンフリクトする
      avalonia:
        patterns:
          - "Avalonia*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # マージキューは 1 PR ずつ検査するので、PR の数を減らす
      actions:
        patterns:
          - "*"
        # 署名の job は PR では動かず、マージ後に手動で signpath-test を実行して確かめるので、単独の PR にする
        exclude-patterns:
          - "signpath/*"
